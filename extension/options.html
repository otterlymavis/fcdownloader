<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FCDownloader Settings</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: 420px; padding: 20px; max-height: none; }
    label { display: block; margin: 14px 0; font-size: 12px; color: var(--ink2); }
    .checkbox-row { display: flex; gap: 8px; align-items: center; margin: 14px 0; }
    h2 { margin: 0 0 6px; font-size: 16px; }
    p.hint { margin: 0; color: var(--ink2); font-size: 11px; }
    .save-row { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
    #saved { color: var(--ink2); font-size: 11px; }
  </style>
</head>
<body>
  <h2>FCDownloader settings</h2>
  <p class="hint">All settings sync across browsers signed into the same account (via chrome.storage.sync).</p>

  <div class="checkbox-row">
    <input id="muxRemote" type="checkbox" checked />
    <label for="muxRemote" style="margin: 0;">Enable HD and streaming video downloads (recommended)</label>
  </div>

  <div class="checkbox-row">
    <input id="allowCookies" type="checkbox" />
    <label for="allowCookies" style="margin: 0;">Use my session cookies for restricted videos (security risk)</label>
  </div>

  <div class="checkbox-row">
    <input id="removeWatermark" type="checkbox" />
    <label for="removeWatermark" style="margin: 0;">Try clean/watermark-free source links</label>
  </div>
  <p class="hint">When enabled, FCDownloader tries a clean source first on supported sites. Leave this off to keep original media. Static image watermarks may remain.</p>

  <div class="save-row">
    <button id="save" class="primary" type="button" style="margin: 0; width: auto;">Save</button>
    <span id="saved"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
