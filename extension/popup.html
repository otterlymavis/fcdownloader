<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FCDownloader</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon-32.png" alt="" width="18" height="18" style="vertical-align: middle; margin-right: 6px; border-radius: 4px;">
      FCDownloader
    </div>
    <button id="settings-btn" type="button" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 0 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 0 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
      </svg>
    </button>
  </header>

  <main>
    <p id="page-info" class="page"></p>
    <section id="helper-status" class="helper-status" hidden>
      <span id="helper-state-icon" class="helper-state-icon" title="Checking Companion" role="img" aria-label="Checking Companion">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>
        </svg>
      </span>
      <span id="helper-text" class="helper-text">Checking download capabilities</span>
      <button id="helper-tools" type="button" hidden title="Update Tools" aria-label="Update Tools">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button id="helper-open" type="button" title="Open Companion" aria-label="Open Companion">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </button>
    </section>

    <!-- Primary card: the single best detection -->
    <section id="primary" hidden>
      <h2 id="primary-title">Media</h2>
      <p id="primary-meta" class="meta"></p>
      <div id="download-options" class="download-options" hidden>
        <label class="option-field" for="quality-select">
          <span>Quality</span>
          <select id="quality-select"></select>
        </label>
        <label id="watermark-option" class="option-check">
          <input id="watermark-toggle" type="checkbox">
          <span>Without watermark when available</span>
        </label>
      </div>
      <div class="primary-actions">
        <button id="primary-download" class="primary" type="button" title="Download" aria-label="Download">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12v9"/><path d="m8 17 4 4 4-4"/><path d="M20.39 10.2A5 5 0 0 0 11 7.3a5.4 5.4 0 0 0-8 4.7 4 4 0 0 0 4 4h14a3 3 0 0 0 1.39-5.8z"/></svg>
        </button>
        <button id="primary-audio-download" class="ghost" type="button" hidden title="Audio" aria-label="Audio">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
        </button>
      </div>
    </section>

    <!-- Empty / fallback state -->
    <section id="empty">
      <p class="empty-text">Always click Find media to get best results!</p>
    </section>

    <div id="status" hidden>
      <div id="status-text"></div>
      <div id="status-progress-container" class="progress-bar-container" style="display: none;">
        <div id="status-progress-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- "More media": collapsed by default, only shown when extras exist -->
    <details id="more" hidden>
      <summary>Show other media</summary>
      <div id="bulk-actions" class="bulk-actions" hidden>
        <button id="select-all" class="ghost" type="button" title="Select all" aria-label="Select all">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>
        </button>
        <button id="download-selected" class="primary" type="button" title="Download selected" aria-label="Download selected">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        </button>
      </div>
      <ul id="more-list"></ul>
    </details>

    <details id="technical" hidden>
      <summary>Show technical sources</summary>
      <p class="technical-note">Raw captured CDN/segment URLs. Use these only if the main media choice is wrong.</p>
      <ul id="technical-list"></ul>
    </details>

    <button id="extract-btn" class="primary extract-btn-large" type="button" title="Find media" aria-label="Find media">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
  </main>

  <footer>
    <a href="https://github.com/otterlymavis/fcdownloader" target="_blank" rel="noopener" title="Help" aria-label="Help">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
