name: CI

on:
  pull_request:
  push:
    branches: [master, backend-version, plus-version, helper-version]

permissions:
  contents: read

jobs:
  app-checks:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "server/requirements-dev.txt"

      - name: Install server test dependencies
        run: python -m pip install -r server/requirements-dev.txt

      - name: Run server tests
        env:
          PYTHONPATH: tests
        run: python -m pytest server/tests

      - name: Run download boundary contract tests
        run: python -m pytest tests/test_local_helper_media_validation.py tests/test_download_contract_probe.py

  companion-helper-tests:
    name: Companion helper tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Test lightweight companion
        working-directory: desktop-companion/nobrowser-go-helper
        env:
          GO111MODULE: "off"
        run: go test
