name: CI

on:
  pull_request:
  push:
    branches: [master, backend-version, plus-version, helper-version]

permissions:
  contents: read

jobs:
  app-checks:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "server/requirements-dev.txt"

      - name: Install server test dependencies
        run: python -m pip install -r server/requirements-dev.txt

      - name: Run server tests
        run: python -m pytest server/tests
